<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不老松 - 團客管理系統後台</title>
    <style>
        /* 深色高質感主題 (Dark Zen Theme) */
        :root {
            color-scheme: dark; /* 讓原生選擇器支援深色模式 */
            --primary-dark: #121212;
            --secondary-dark: #1e1e1e;
            --primary-green: #1b5e20;
            --accent-gold: #d4af37;
            --text-light: #f5f5f5;
            --text-gray: #aaaaaa;
            --bg-dark: #0a0a0a;
            --border-color: #333333;
            
            --status-pending: #fbc02d; /* 確認中 - 黃 */
            --status-confirmed: #4caf50; /* 已確認 - 綠 */
            --status-completed: #9e9e9e; /* 已完成 - 灰 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }

        /* Custom Modal */
        #custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; display: none;
            justify-content: center; align-items: center;
        }
        .custom-modal {
            background: var(--secondary-dark); border: 1px solid var(--accent-gold);
            padding: 30px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .custom-modal p { color: var(--text-light); margin-bottom: 25px; font-size: 16px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; }
        .modal-buttons button {
            padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 15px; font-weight: bold; transition: 0.2s; min-width: 100px;
        }
        .btn-modal-confirm { background: var(--accent-gold); color: var(--bg-dark); }
        .btn-modal-cancel { background: transparent; color: var(--text-gray); border: 1px solid var(--border-color); }
        .btn-modal-confirm:hover { background: #ebd599; }
        .btn-modal-cancel:hover { background: #333; color: white; }

        /* Login Modal */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: var(--secondary-dark); border: 1px solid var(--accent-gold);
            padding: 40px 30px; border-radius: 8px; text-align: center; color: var(--accent-gold);
            width: 90%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .login-box h2 { margin-bottom: 25px; letter-spacing: 2px; font-weight: normal; }
        .login-box input {
            width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border-color);
            background: var(--primary-dark); color: var(--text-light); border-radius: 5px; font-size: 16px;
            text-align: center; letter-spacing: 2px;
        }
        .login-box input:focus { outline: none; border-color: var(--accent-gold); }
        .login-box button {
            width: 100%; padding: 15px; background: var(--accent-gold);
            color: var(--bg-dark); font-weight: bold; font-size: 16px;
            border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .login-box button:hover { background: #ebd599; }

        /* Sidebar */
        #sidebar {
            width: 300px; background-color: var(--secondary-dark); color: var(--text-light);
            display: flex; flex-direction: column; transition: 0.3s; z-index: 100;
            border-right: 1px solid var(--border-color);
        }
        #sidebar.collapsed { margin-left: -300px; }
        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border-color); text-align: center;
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header img { max-width: 140px; }
        .menu-btn { background: none; border: none; color: var(--accent-gold); font-size: 24px; cursor: pointer; }
        
        .nav-buttons { display: flex; padding: 15px; gap: 10px; }
        .nav-buttons button {
            flex: 1; padding: 10px; background: var(--primary-dark); color: var(--text-gray); border: 1px solid var(--border-color);
            cursor: pointer; border-radius: 5px; transition: 0.2s; font-size: 14px;
        }
        .nav-buttons button.active { background: var(--accent-gold); color: var(--bg-dark); font-weight: bold; border-color: var(--accent-gold); }
        
        .new-group-btn { margin: 0 15px 15px 15px; padding: 12px; background: var(--primary-green); color: white; text-align: center; border-radius: 5px; cursor: pointer; font-weight: bold; letter-spacing: 1px; }
        .new-group-btn:hover { background: #2e7d32; }

        #group-list { flex: 1; overflow-y: auto; padding: 0 15px 15px 15px; }
        .list-section-title { font-size: 13px; color: var(--text-gray); margin: 15px 0 10px 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        
        .group-item {
            padding: 15px; margin-bottom: 10px; background: var(--primary-dark); border-radius: 6px;
            cursor: pointer; border-left: 4px solid transparent; display: flex; flex-direction: column;
            border: 1px solid var(--border-color); border-left-width: 4px; transition: 0.2s;
        }
        .group-item:hover { background: #2a2a2a; }
        .group-item.active { background: #2a2a2a; border-left-color: var(--accent-gold); }
        
        .group-item.status-pending { border-left-color: var(--status-pending); }
        .group-item.status-confirmed { border-left-color: var(--status-confirmed); }
        .group-item.status-completed { border-left-color: var(--status-completed); opacity: 0.6; }
        .group-item.active.status-pending, .group-item.active.status-confirmed, .group-item.active.status-completed { border-left-color: var(--accent-gold); opacity: 1;}

        .group-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .group-item-title { font-weight: bold; color: var(--text-light); font-size: 15px; word-break: break-all; }
        .group-actions span { margin-left: 10px; font-size: 14px; color: var(--text-gray); cursor: pointer; }
        .group-actions span:hover { color: var(--accent-gold); }
        .group-item-time { font-size: 12px; color: var(--text-gray); }

        /* Main Content */
        #main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-bar {
            background: var(--secondary-dark); padding: 15px 25px; display: flex; align-items: center;
            border-bottom: 1px solid var(--border-color); gap: 15px;
        }
        .top-bar h2 { font-size: 18px; font-weight: normal; color: var(--accent-gold); }
        
        .view-section { padding: 25px; display: none; max-width: 900px; margin: 0 auto; width: 100%; }
        .view-section.active { display: block; }
        
        .card { background: var(--secondary-dark); border-radius: 8px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary-green); }
        h3 { color: var(--accent-gold); margin-bottom: 20px; font-weight: normal; letter-spacing: 1px; font-size: 18px; display: flex; justify-content: space-between; align-items: center;}
        
        /* Form Elements */
        .form-row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-gray); letter-spacing: 1px;}
        input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; 
            font-size: 15px; background: var(--primary-dark); color: var(--text-light); transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); outline: none; }
        input[readonly], select:disabled { background-color: rgba(255,255,255,0.05); color: #888; cursor: not-allowed; border-color: transparent;}
        
        /* 讓日期與時間的選擇圖示反轉為白色，並確保滑鼠游標為點擊狀態 */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.8;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover,
        input[type="time"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .notice-box { background: rgba(212, 175, 55, 0.1); border-left: 4px solid var(--accent-gold); padding: 20px; margin-bottom: 25px; border-radius: 0 4px 4px 0; font-size: 14px; line-height: 1.8; color: #ddd; }
        
        /* Guest List */
        .guest-row {
            display: flex; gap: 15px; align-items: center; padding: 15px; margin-bottom: 12px;
            background: var(--primary-dark); border: 1px solid var(--border-color); border-radius: 6px; flex-wrap: wrap;
        }
        .guest-row select { flex: 2; min-width: 180px; }
        .guest-row .gender-pref { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 120px; color: var(--text-light); }
        .btn-remove { background: rgba(244, 67, 54, 0.1); color: #ef5350; border: 1px solid rgba(244, 67, 54, 0.3); padding: 10px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-remove:hover { background: rgba(244, 67, 54, 0.2); }
        
        .btn-add { background: var(--primary-green); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; display: block; width: 100%; margin-top: 15px; transition: 0.2s; letter-spacing: 1px;}
        .btn-add:hover { background: #2e7d32; }
        
        .quick-add-box { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; background: var(--primary-dark); padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border-color); }
        .quick-add-box input { width: 80px; margin: 0; padding: 8px; text-align: center; }
        .btn-quick-add { background: var(--accent-gold); color: var(--bg-dark); border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .menu-edit-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; background: var(--primary-dark); padding: 15px; border: 1px solid var(--border-color); border-radius: 6px; flex-wrap: wrap;}
        .menu-edit-row input { flex: 1; min-width: 120px; }
        .menu-edit-row select { width: 140px; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; background: var(--primary-green); font-size: 14px;}
        .btn-danger { background: rgba(244, 67, 54, 0.1); color: #ef5350; border: 1px solid rgba(244, 67, 54, 0.3); }
        
        .summary-box { background: var(--primary-dark); border: 1px solid var(--accent-gold); padding: 25px; border-radius: 8px; margin-top: 25px; display: flex; justify-content: space-around; text-align: center; }
        .summary-item h4 { color: var(--text-gray); font-size: 14px; margin-bottom: 10px; font-weight: normal;}
        .summary-item span { font-size: 32px; font-weight: bold; color: var(--accent-gold); }

        .status-select { font-weight: bold; }
        .status-select.s-pending { color: var(--status-pending); border-color: var(--status-pending); }
        .status-select.s-confirmed { color: var(--status-confirmed); border-color: var(--status-confirmed); }
        .status-select.s-completed { color: var(--status-completed); border-color: var(--status-completed); }

        .client-mode #sidebar { display: none !important; }
        .client-mode #main-content { margin-left: 0; }
        .client-mode .admin-only { display: none !important; }
        .client-mode body { background-color: var(--secondary-dark); }
        
        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .top-bar { padding: 15px; }
            .view-section { padding: 15px; }
            .guest-row { flex-direction: column; align-items: stretch; }
            .guest-row select, .guest-row .gender-pref, .btn-remove { width: 100%; }
            .quick-add-box { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- 客製化彈窗 -->
    <div id="custom-modal-overlay">
        <div class="custom-modal">
            <p id="custom-modal-msg">訊息</p>
            <div class="modal-buttons" id="custom-modal-btns"></div>
        </div>
    </div>

    <!-- 登入 Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>不老松團客管理系統</h2>
            <input type="password" id="login-pwd" placeholder="請輸入管理員憑證" required>
            <button onclick="window.attemptLogin('admin')">進入系統</button>
        </div>
    </div>

    <!-- Sidebar (Admin) -->
    <div id="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" alt="不老松" onerror="this.src='https://via.placeholder.com/150x50?text=Logo'">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </div>
        <div class="nav-buttons">
            <button id="btn-tab-groups" class="active" onclick="switchAdminTab('groups')">團客列表</button>
            <button id="btn-tab-settings" onclick="switchAdminTab('settings')">系統設定</button>
        </div>
        
        <div id="sidebar-groups" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="new-group-btn" onclick="createNewGroup()">+ 新增團客需求單</div>
            <div id="group-list">
                <!-- 群組列表 -->
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="top-bar admin-only">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2 id="top-bar-title">請選擇或新增專案</h2>

        <!-- 團客專案視圖 -->

                <span style="color:#aaa; font-size: 13px;">※ 服務腳底需要泡腳10分鐘 + 肩頸。顧客休息室可容納約 40 位。</span>
            </div>

            <div class="card" id="group-basic-info">
                <div class="form-row">
                    <div class="form-group admin-only">
                        <label>專案狀態</label>
                        <select id="db-status" class="auto-save status-select" onchange="updateStatusColor(this)">
                            <option value="確認中">確認中</option>
                            <option value="已確認">已確認</option>
                            <option value="已完成">已完成</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="db-date" class="auto-save">
                    </div>
                    <div class="form-group">
                        <label>預約時間 (起)</label>
                        <input type="time" id="db-timeStart" class="auto-save">
                    </div>
                    <div class="form-group">
                        <label>預約時間 (迄)</label>
                        <input type="time" id="db-timeEnd" class="auto-save">
                    </div>
                    <div class="form-group">
                        <label>服務分店</label>
                        <select id="db-store" class="auto-save">
                            <!-- Options from DB -->
                        </select>
                    </div>
                </div>
                
                <div class="form-group admin-only" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <label style="color: var(--accent-gold);">客端專屬分享網址 (客人免登入直接填寫)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="g-share-url" readonly style="background: var(--primary-dark);">
                        <button class="btn-action" onclick="copyShareUrl()">複製網址</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>顧客名單與服務需求</h3>
                
                <!-- 開放給客端使用的快速新增區塊，移除了 admin-only class -->
                <div class="quick-add-box">
                    <span style="font-size: 14px; color: var(--text-gray);">快速新增空位：</span>
                    <input type="number" id="quick-add-num" min="1" max="50" value="10">
                    <button class="btn-quick-add" onclick="quickAddGuests()">批次產生欄位</button>
                </div>
                
                <div id="guest-container">
                    <!-- Guest Rows -->
                </div>
                <button class="btn-add" onclick="addGuestRow()">+ 新增一位顧客</button>
            </div>

            <div class="card">
                <h3>備註事項</h3>
                <textarea id="db-remarks" rows="4" class="auto-save" placeholder="如有其他特殊需求請填寫於此..."></textarea>
            </div>

            <div class="summary-box">
                <div class="summary-item">
                    <h4>總人數</h4>
                    <span id="sum-people">0</span>
                </div>
                <div class="summary-item">
                    <h4>指定女師需求</h4>
                    <span id="sum-female">0</span>
                </div>
            </div>
        </div>

        <!-- 系統設定視圖 (僅管理員) -->
        <div id="view-settings" class="view-section admin-only">
            <div class="card">
                <h3>分店開放設定</h3>
                <div id="store-settings-container"></div>
            </div>
            
            <div class="card">
                <h3 style="display: flex; flex-wrap: wrap; gap: 10px;">
                    服務項目與價格設定
                </h3>
                <div style="margin-bottom: 20px; color: var(--text-gray); font-size: 14px;">設定後將同步更新至所有客端選單。</div>
                <div id="menu-settings-container">
                    <!-- Menu items -->
                </div>
                <button class="btn-action" onclick="addMenuItem()" style="margin-top: 10px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold);">+ 手動新增一筆</button>
            </div>
        </div>
    </div>

            { id: 26, name: "足湯全身精油SPA (90分)", price: 2250, type: "body" },
            { id: 27, name: "足湯全身精油SPA (120分)", price: 2900, type: "body" },
            { id: 28, name: "足湯肩頸按摩 (20分)", price: 450, type: "foot" },
            { id: 29, name: "刮痧 (次-30分)", price: 650, type: "body" },
            { id: 30, name: "修腳指甲+修腳皮", price: 1000, type: "foot" },
            { id: 31, name: "腳底按摩+修腳皮", price: 1300, type: "foot" },
            { id: 32, name: "腳底按摩+修腳指甲+修腳皮", price: 1800, type: "foot" },
            { id: 33, name: "修腳皮", price: 600, type: "foot" },
            { id: 34, name: "修腳指甲", price: 600, type: "foot" }
        ];

        // Global State
        let isClientMode = false;
        let clientGroupId = null; 
        
        let globalSettings = { stores: {}, menuItems: [] };
        let groupsData = {};
        let currentGroupId = null;

        // --- 客製化彈窗系統 ---
        window.customAlert = (msg) => {
            return new Promise((resolve) => {
                document.getElementById('custom-modal-msg').innerHTML = msg;
                const btns = document.getElementById('custom-modal-btns');
                btns.innerHTML = `<button class="btn-modal-confirm" id="modal-btn-ok">了解</button>`;
                document.getElementById('custom-modal-overlay').style.display = 'flex';
                document.getElementById('modal-btn-ok').onclick = () => {
                    document.getElementById('custom-modal-overlay').style.display = 'none';
                    resolve(true);
                };
            });
        };

        window.customConfirm = (msg) => {
            return new Promise((resolve) => {
                document.getElementById('custom-modal-msg').innerHTML = msg;
                const btns = document.getElementById('custom-modal-btns');
                btns.innerHTML = `
                    <button class="btn-modal-cancel" id="modal-btn-no">取消</button>
                    <button class="btn-modal-confirm" id="modal-btn-yes">確定</button>
                `;
                document.getElementById('custom-modal-overlay').style.display = 'flex';
                document.getElementById('modal-btn-yes').onclick = () => {
                    document.getElementById('custom-modal-overlay').style.display = 'none'; resolve(true);
                };
                document.getElementById('modal-btn-no').onclick = () => {
                    document.getElementById('custom-modal-overlay').style.display = 'none'; resolve(false);
                };
            });
        };

        window.customPrompt = (msg, defaultText = "") => {
            return new Promise((resolve) => {
                document.getElementById('custom-modal-msg').innerHTML = `
                    ${msg}<br>
                    <input type="text" id="modal-prompt-input" value="${defaultText}" style="width:100%; margin-top:15px; padding:10px; background:var(--primary-dark); color:white; border:1px solid var(--accent-gold); border-radius:4px; text-align:center;">
                `;
                const btns = document.getElementById('custom-modal-btns');
                btns.innerHTML = `
                    <button class="btn-modal-cancel" id="modal-btn-no">取消</button>
                    <button class="btn-modal-confirm" id="modal-btn-yes">確定</button>
                `;
                document.getElementById('custom-modal-overlay').style.display = 'flex';
                const inputEl = document.getElementById('modal-prompt-input');
                inputEl.focus(); inputEl.select();
                document.getElementById('modal-btn-yes').onclick = () => {
                    document.getElementById('custom-modal-overlay').style.display = 'none'; resolve(inputEl.value);
                };
                document.getElementById('modal-btn-no').onclick = () => {
                    document.getElementById('custom-modal-overlay').style.display = 'none'; resolve(null);
                };
            });
        };

        // --- 初始化與權限判斷 ---
        function initApp() {
            const hash = window.location.hash.substring(1);
            if (hash && hash.length > 5) {
                isClientMode = true;
                clientGroupId = hash;
                document.body.classList.add('client-mode');
                document.getElementById('login-overlay').style.display = 'none';
                startDatabaseSync();
            } else {
                isClientMode = false;
                document.getElementById('login-overlay').style.display = 'flex';
            }
        }

        document.getElementById('login-pwd').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.attemptLogin('admin');
        });

        window.attemptLogin = async (mode) => {
            if (mode === 'admin') {
                const pwd = document.getElementById('login-pwd').value;
                if (pwd !== '8888') {
                    await window.customAlert('密碼錯誤！請重新輸入。');
                    return;
                }
                document.getElementById('login-overlay').style.display = 'none';
                startDatabaseSync();
            }
        };

        // --- 資料庫同步 ---
        function startDatabaseSync() {
            onSnapshot(doc(db, "settings", "global"), (docSnap) => {
                let shouldForceUpdate = false;
                
                if (docSnap.exists()) {
                    globalSettings = docSnap.data();
                    if (!globalSettings.menuItems || globalSettings.menuItems.length === 0) {
                        globalSettings.menuItems = [...photoDefaultMenu];
                        shouldForceUpdate = true;
                    }
                } else {
                    globalSettings = {
                        stores: { "中清店": true, "中港店": false, "中科店": false },
                        menuItems: [...photoDefaultMenu]
                    };
                    shouldForceUpdate = true;
                }
                
                if (shouldForceUpdate) {
                    setDoc(doc(db, "settings", "global"), globalSettings);
                }

                if (!isClientMode) renderAdminSettings();
                updateStoreOptions();
                if (currentGroupId && groupsData[currentGroupId]) renderGroupData(groupsData[currentGroupId]); 
            });

            if (!isClientMode) {
                onSnapshot(collection(db, "groups"), (snapshot) => {
                    groupsData = {};
                    snapshot.forEach(doc => { groupsData[doc.id] = doc.data(); });
                    renderGroupList();
                });
            } else {
                if (clientGroupId) {
                    currentGroupId = clientGroupId;
                    onSnapshot(doc(db, "groups", clientGroupId), async (docSnap) => {
                        if (docSnap.exists()) {
                            document.getElementById('view-group').classList.add('active'); 
                            groupsData[clientGroupId] = docSnap.data();
                            renderGroupData(groupsData[clientGroupId]);
                            lockClientFields();
                            checkDateAlert(groupsData[clientGroupId].date);
                        } else {
                            await window.customAlert("找不到此需求單，可能已被管理員刪除。");
                        }
                    });
                }
            }
        }

        // 客端提醒
        let alertShown = false;
        async function checkDateAlert(bookDateStr) {
            if (!bookDateStr || alertShown || !isClientMode) return;
            const bookDate = new Date(bookDateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            const diffDays = Math.ceil((bookDate - today) / (1000 * 60 * 60 * 24)); 
            
            if (diffDays === 7 || diffDays === 3 || diffDays === 1) {
                alertShown = true;
                await window.customAlert(`【貼心提醒】<br>距離您的預約日期只剩 <span style="color:var(--accent-gold); font-size:20px;">${diffDays}</span> 天。<br>請再次確認人數與服務需求是否需要調整！`);
            }
        }

        function lockClientFields() {
            document.getElementById('db-date').readOnly = true;
            document.getElementById('db-timeStart').readOnly = true;
            document.getElementById('db-timeEnd').readOnly = true;
            document.getElementById('db-store').disabled = true;
        }

        // --- 介面渲染與資料寫入 ---
        function renderGroupList() {
            const list = document.getElementById('group-list');
            list.innerHTML = '';
            
            let activeGroups = [];
            let completedGroups = [];
            const now = new Date();

            Object.keys(groupsData).forEach(id => {
                const g = groupsData[id];
                g._id = id;
                
                let isExpired = false;
                if (g.date && g.timeEnd) {
                    const endDateTime = new Date(`${g.date}T${g.timeEnd}`);
                    if (now > endDateTime) isExpired = true;
                }

                if (g.status === '已完成' || isExpired) {
                    if(isExpired && g.status !== '已完成') {
                        updateDoc(doc(db, "groups", id), { status: '已完成' });
                        g.status = '已完成';
                    }
                    completedGroups.push(g);
                } else {
                    activeGroups.push(g);
                }
            });

            const sortFn = (a, b) => (b.date || '0').localeCompare(a.date || '0');
            activeGroups.sort(sortFn);
            completedGroups.sort(sortFn);

            if (activeGroups.length > 0) {
                list.innerHTML += `<div class="list-section-title">進行中專案</div>`;
                activeGroups.forEach(g => list.appendChild(createGroupEl(g)));
            }
            if (completedGroups.length > 0) {
                list.innerHTML += `<div class="list-section-title">已完成/歷史紀錄</div>`;
                completedGroups.forEach(g => list.appendChild(createGroupEl(g)));
            }
        }

        function createGroupEl(g) {
            const div = document.createElement('div');
            let statusClass = 'status-pending';
            if(g.status === '已確認') statusClass = 'status-confirmed';
            if(g.status === '已完成') statusClass = 'status-completed';

            div.className = `group-item ${statusClass} ${g._id === currentGroupId ? 'active' : ''}`;
            div.innerHTML = `
                <div class="group-item-header">
                    <span class="group-item-title" onclick="window.loadGroup('${g._id}')">${g.name || '未命名專案'}</span>
                    <div class="group-actions">
                        <span onclick="window.editGroupName(event, '${g._id}')" title="重新命名">✏️</span>
                        <span onclick="window.deleteGroup(event, '${g._id}')" title="刪除">🗑️</span>
                    </div>
                </div>
                <div class="group-item-time" onclick="window.loadGroup('${g._id}')">
                    ${g.date || '未定'} | ${g.timeStart || '--'}~${g.timeEnd || '--'} | ${g.store || '未定'}
                </div>
            `;
            return div;
        }

        window.createNewGroup = async () => {
            const newId = Date.now().toString(); 
            const newGroup = {
                name: "新團客專案", status: "確認中",
                date: "", timeStart: "", timeEnd: "", store: "中清店",
                remarks: "", guests: []
            };
            await setDoc(doc(db, "groups", newId), newGroup);
            window.loadGroup(newId);
        };

        window.loadGroup = (id) => {
            currentGroupId = id;
            switchAdminTab('groups');
            renderGroupList();
            document.getElementById('view-group').classList.add('active');
            
            const baseUrl = window.location.href.split('#')[0];
            document.getElementById('g-share-url').value = `${baseUrl}#${id}`;
            renderGroupData(groupsData[id]);
        };

        window.editGroupName = async (e, id) => {
            e.stopPropagation();
            const currentName = groupsData[id].name || '';
            const newName = await window.customPrompt("請輸入新的專案名稱：", currentName);
            if (newName && newName.trim() !== "") {
                await updateDoc(doc(db, "groups", id), { name: newName.trim() });
            }
        };

        window.deleteGroup = async (e, id) => {
            e.stopPropagation();
            const pwd = await window.customPrompt("⚠️ 刪除專案請輸入權限密碼：");
            if (pwd === "8888") { // 密碼已統一為 8888
                const confirmDel = await window.customConfirm("確定要永久刪除此專案嗎？");
                if (confirmDel) {
                    await deleteDoc(doc(db, "groups", id));
                    if (currentGroupId === id) {
                        currentGroupId = null;
                        document.getElementById('view-group').classList.remove('active');
                    }
                }
            } else if (pwd !== null) {
                await window.customAlert("密碼錯誤，拒絕刪除。");
            }
        };

        function renderGroupData(data) {
            if (!data) return;
            document.getElementById('top-bar-title').innerText = isClientMode ? `填寫需求單 - ${data.name}` : `編輯專案: ${data.name}`;
            
            const fields = ['status', 'date', 'timeStart', 'timeEnd', 'store', 'remarks'];
            fields.forEach(f => {
                const el = document.getElementById(`db-${f}`);
                if (el && document.activeElement !== el) {
                    el.value = data[f] || (f === 'status' ? '確認中' : "");
                    if(f === 'status') window.updateStatusColor(el);
                }
            });

            renderGuestList(data.guests || []);
        }

        window.updateStatusColor = (selectEl) => {
            selectEl.className = 'auto-save status-select';
            if(selectEl.value === '確認中') selectEl.classList.add('s-pending');
            if(selectEl.value === '已確認') selectEl.classList.add('s-confirmed');
            if(selectEl.value === '已完成') selectEl.classList.add('s-completed');
        };

        document.querySelectorAll('.auto-save').forEach(el => {
            el.addEventListener('change', (e) => {
                if (!currentGroupId) return;
                const fieldName = e.target.id.replace('db-', '');
                updateDoc(doc(db, "groups", currentGroupId), {
                    [fieldName]: e.target.value
                });
            });
        });

        window.copyShareUrl = async () => {
            const url = document.getElementById('g-share-url').value;
            navigator.clipboard.writeText(url).then(async () => {
                await window.customAlert('專屬網址已複製！請傳送給客人填寫。');
            });
        };

        function renderGuestList(guests) {
            const container = document.getElementById('guest-container');
            container.innerHTML = '';
            
            let total = 0, femaleCount = 0;
            const menuOptions = (globalSettings.menuItems || []).map(item => 
                `<option value="${item.id}" data-type="${item.type}">${item.name} ($${item.price})</option>`
            ).join('');

            guests.forEach((g, index) => {
                total++;
                const itemDef = globalSettings.menuItems.find(m => m.id == g.itemId);
                const isBody = itemDef ? (itemDef.type === 'body') : false;
                if (isBody && g.reqFemale) femaleCount++;

                const row = document.createElement('div');
                row.className = 'guest-row';
                row.innerHTML = `
                    <span style="font-weight:bold; color:var(--accent-gold); width:30px;">#${index + 1}</span>
                    <select onchange="window.updateGuest(${index}, 'itemId', this.value)">
                        <option value="">-- 請選擇服務項目 --</option>
                        ${menuOptions}
                    </select>
                    <div class="gender-pref">
                        <label style="margin:0; font-weight:normal; cursor:pointer;">
                            <input type="checkbox" onchange="window.updateGuest(${index}, 'reqFemale', this.checked)" 
                            ${g.reqFemale ? 'checked' : ''} ${isBody ? '' : 'disabled'}> 指定女師
                        </label>
                    </div>
                    <button class="btn-remove" onclick="window.removeGuest(${index})">✕</button>
                `;
                const select = row.querySelector('select');
                if (g.itemId) select.value = g.itemId;
                
                container.appendChild(row);
            });

            document.getElementById('sum-people').innerText = total;
            document.getElementById('sum-female').innerText = femaleCount;
        }

        window.addGuestRow = async () => {
            if (!currentGroupId) return;
            const currentGuests = groupsData[currentGroupId].guests || [];
            currentGuests.push({ itemId: "", reqFemale: false });
            await updateDoc(doc(db, "groups", currentGroupId), { guests: currentGuests });
        };

        window.quickAddGuests = async () => {
            if (!currentGroupId) return;
            const num = parseInt(document.getElementById('quick-add-num').value);
            if (num > 0 && num <= 50) {
                const currentGuests = groupsData[currentGroupId].guests || [];
                for(let i=0; i<num; i++) {
                    currentGuests.push({ itemId: "", reqFemale: false });
                }
                await updateDoc(doc(db, "groups", currentGroupId), { guests: currentGuests });
            }
        };

        window.updateGuest = async (index, field, value) => {
            if (!currentGroupId) return;
            const currentGuests = groupsData[currentGroupId].guests || [];
            
            if (field === 'itemId') {
                const itemDef = globalSettings.menuItems.find(m => m.id == value);
                if (itemDef && itemDef.type !== 'body') {
                    currentGuests[index].reqFemale = false;
                }
            }
            currentGuests[index][field] = value;
            await updateDoc(doc(db, "groups", currentGroupId), { guests: currentGuests });
        };

        window.removeGuest = async (index) => {
            if (!currentGroupId) return;
            const currentGuests = groupsData[currentGroupId].guests || [];
            currentGuests.splice(index, 1);
            await updateDoc(doc(db, "groups", currentGroupId), { guests: currentGuests });
        };

        // --- 系統設定更新 ---
        function updateStoreOptions() {
            const select = document.getElementById('db-store');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- 請選擇分店 --</option>';
            
            Object.keys(globalSettings.stores || {}).forEach(store => {
                if (globalSettings.stores[store]) {
                    select.innerHTML += `<option value="${store}">${store}</option>`;
                }
            });
            if (currentVal) select.value = currentVal;
        }

        function renderAdminSettings() {
            const sContainer = document.getElementById('store-settings-container');
            sContainer.innerHTML = '';
            Object.keys(globalSettings.stores).forEach(store => {
                const isChecked = globalSettings.stores[store];
                const isDefault = (store === '中清店');
                sContainer.innerHTML += `
                    <div class="setting-item">
                        <span style="color:var(--text-light); font-size:15px;">${store}</span>
                        <label style="margin:0; cursor:pointer;">
                            <input type="checkbox" onchange="window.updateStoreSetting('${store}', this.checked)"
                            ${isChecked ? 'checked' : ''} ${isDefault ? 'disabled' : ''}> 啟用
                        </label>
                    </div>
                `;
            });

            const mContainer = document.getElementById('menu-settings-container');
            mContainer.innerHTML = '';
            (globalSettings.menuItems || []).forEach((item, index) => {
                mContainer.innerHTML += `
                    <div class="menu-edit-row">
                        <input type="text" placeholder="項目名稱" value="${item.name}" onchange="window.updateMenuItem(${index}, 'name', this.value)">
                        <input type="number" placeholder="價格" value="${item.price}" onchange="window.updateMenuItem(${index}, 'price', parseInt(this.value))">
                        <select onchange="window.updateMenuItem(${index}, 'type', this.value)">
                            <option value="body" ${item.type === 'body' ? 'selected' : ''}>身體 (可指定女師)</option>
                            <option value="foot" ${item.type === 'foot' ? 'selected' : ''}>腳底/其他 (鎖定女師)</option>
                        </select>
                        <button class="btn-action btn-danger" onclick="window.removeMenuItem(${index})">刪除</button>
                    </div>
                `;
            });
        }

        window.updateStoreSetting = async (store, isOpen) => {
            const newStores = { ...globalSettings.stores, [store]: isOpen };
            await updateDoc(doc(db, "settings", "global"), { stores: newStores });
        };

        window.addMenuItem = async () => {
            const items = [...(globalSettings.menuItems || [])];
            items.push({ id: Date.now(), name: "新項目", price: 0, type: "body" });
            await updateDoc(doc(db, "settings", "global"), { menuItems: items });
        };

        window.updateMenuItem = async (index, field, value) => {
            const items = [...(globalSettings.menuItems || [])];
            items[index][field] = value;
            await updateDoc(doc(db, "settings", "global"), { menuItems: items });
        };

        window.removeMenuItem = async (index) => {
            const confirmDel = await window.customConfirm('確定移除此項目？<br><span style="font-size:12px; color:#aaa;">(不會影響歷史訂單)</span>');
            if(confirmDel) {
                const items = [...(globalSettings.menuItems || [])];
                items.splice(index, 1);
                await updateDoc(doc(db, "settings", "global"), { menuItems: items });
            }
        };

        // --- UI 操作 ---
        window.switchAdminTab = (tab) => {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-buttons button').forEach(el => el.classList.remove('active'));
            
            if (tab === 'groups') {
                document.getElementById('btn-tab-groups').classList.add('active');
                if (currentGroupId) document.getElementById('view-group').classList.add('active');
            } else if (tab === 'settings') {
                document.getElementById('btn-tab-settings').classList.add('active');
                document.getElementById('view-settings').classList.add('active');
            }
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.add('collapsed');
        };

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        };

        window.onload = initApp;
    </script>
</body>
</html>
