<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不老松 - 團客需求單系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pine-dark': '#0a1a12',
                        'pine-green': '#113a26',
                        'pine-light': '#1e5c3e',
                        'gold': '#D4AF37',
                        'gold-light': '#F3E5AB'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050d09;
            color: #e5e7eb;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        }
        
        /* 隱藏捲軸但保留捲動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 項目卡片懸停效果 */
        .service-item {
            transition: all 0.2s ease-in-out;
        }
        .service-item:hover {
            border-color: #D4AF37;
        }

        /* 自訂 Checkbox 樣式 */
        input[type="checkbox"] {
            accent-color: #D4AF37;
        }

        /* 側邊欄收折效果 */
        .sidebar-transition {
            transition: margin-left 0.3s ease-in-out;
        }
        .sidebar-collapsed {
            margin-left: -16rem; /* 隱藏 w-64 (16rem) */
        }
        
        /* 行動裝置側邊欄為絕對定位覆蓋 */
        @media (max-width: 768px) {
            .sidebar-absolute {
                position: absolute;
                height: 100%;
                z-index: 50;
            }
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden relative">

    <aside id="sidebar" class="w-64 bg-pine-dark border-r border-pine-green flex flex-col h-full flex-shrink-0 z-40 shadow-2xl sidebar-transition sidebar-absolute">
        <!-- Logo 區塊 -->
        <div class="p-4 flex flex-col items-center justify-center border-b border-pine-green relative">
            <button onclick="toggleSidebar(false)" class="md:hidden absolute top-4 right-4 text-gray-400 hover:text-white p-2">
                <i class="fas fa-times"></i>
            </button>
            <!-- 更新 Logo 圖片來源，若 logo.png 找不到則回退使用原始圖片 -->
            <img src="logo.png" onerror="this.src='1000039073.png'" alt="不老松 Logo" class="w-28 h-28 object-contain drop-shadow-md rounded-full bg-black/50">
            <h1 class="text-gold font-bold text-lg mt-3 tracking-widest">團客需求管理</h1>
        </div>

        <!-- 頁籤列表 -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2" id="tab-list">
            <!-- 動態生成 Tabs -->
        </div>

        <!-- 新增團客按鈕 -->
        <div class="p-4 border-t border-pine-green">
            <button onclick="addGroup()" class="w-full bg-pine-green hover:bg-pine-light text-gold-light font-bold py-2 px-4 rounded transition duration-300 flex items-center justify-center gap-2">
                <i class="fas fa-plus"></i> 新增團客分頁
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] w-full">
        
        <!-- 頂部導覽列 -->
        <header class="h-14 bg-pine-dark/90 backdrop-blur border-b border-pine-green flex items-center justify-between px-4 shrink-0 z-10 shadow-md">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gold hover:text-gold-light text-xl p-2 rounded hover:bg-pine-green transition" title="收折/展開選單">
                    <i class="fas fa-bars"></i>
                </button>
                <span id="top-title" class="text-gold font-bold tracking-wider">系統載入中...</span>
            </div>
            <div id="share-container" class="hidden flex items-center">
                <button onclick="copyShareLink()" class="flex items-center gap-2 bg-pine-light hover:bg-pine-green text-white px-3 py-1.5 rounded text-sm transition shadow border border-pine-green">
                    <i class="fas fa-link"></i> <span class="hidden sm:inline">複製專屬連結</span>
                </button>
            </div>
        </header>

        <!-- 內容容器 -->
        <div id="main-content" class="flex-1 overflow-y-auto p-6 lg:p-10 no-scrollbar">
            <!-- 動態生成內容 -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 用戶提供的 Firebase 設定檔
        const firebaseConfig = {
            apiKey: "AIzaSyCdwtBsj7wOM9jPprztsq8xx21yeKswt0Q",
            authDomain: "mtsb-1c6f4.firebaseapp.com",
            projectId: "mtsb-1c6f4",
            storageBucket: "mtsb-1c6f4.firebasestorage.app",
            messagingSenderId: "171768683975",
            appId: "1:171768683975:web:6fe5b2a07ec7d853494de2",
            measurementId: "G-NMDDF1QLYZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const sysAppId = "bulao_song_system"; // 資料庫儲存空間代號

        let menuData = [
            { category: '運動筋膜刀按摩', items: [
                { id: 'f_m_1', name: '肩頸按摩 30分', price: 800, type: 'foot', active: true },
                { id: 'f_m_2', name: '腳底按摩 40分', price: 1200, type: 'foot', active: true },
                { id: 'f_m_3', name: '腳底按摩 60分', price: 1750, type: 'foot', active: true },
                { id: 'b_m_1', name: '全身按摩 60分', price: 1800, type: 'body', active: true },
                { id: 'b_m_2', name: '全身按摩 90分', price: 2600, type: 'body', active: true }
            ]},
            { category: '養身套餐優惠', items: [
                { id: 'c_1', name: '延禧 (腳底+肩頸) 70分', price: 1549, type: 'foot', active: true },
                { id: 'c_2', name: '如懿 (腳底+肩頸) 90分', price: 1949, type: 'foot', active: true },
                { id: 'c_3', name: '甄嬛 (全身+腳底) 130分', price: 2349, type: 'body', active: true },
                { id: 'c_4', name: '乾隆 (全身SPA+腳底) 110分', price: 2699, type: 'body', active: true },
                { id: 'c_5', name: '皇貴妃 (全身SPA+肩頸) 130分', price: 2899, type: 'body', active: true }
            ]},
            { category: '腳底按摩 & 全身指壓', items: [
                { id: 'f_1', name: '足湯腳底按摩 40分', price: 800, type: 'foot', active: true },
                { id: 'f_2', name: '足湯腳底按摩 60分', price: 1200, type: 'foot', active: true },
                { id: 'f_3', name: '足湯精油腳底 40分', price: 1100, type: 'foot', active: true },
                { id: 'f_4', name: '足湯精油腳底 60分', price: 1500, type: 'foot', active: true },
                { id: 'b_1', name: '足湯全身指壓 60分', price: 1100, type: 'body', active: true },
                { id: 'b_2', name: '足湯全身指壓 90分', price: 1650, type: 'body', active: true },
                { id: 'b_3', name: '足湯全身油壓 60分', price: 1300, type: 'body', active: true },
                { id: 'b_4', name: '足湯全身油壓 90分', price: 1950, type: 'body', active: true },
                { id: 'b_5', name: '全身精油SPA 60分', price: 1600, type: 'body', active: true },
                { id: 'b_6', name: '全身精油SPA 90分', price: 2250, type: 'body', active: true }
            ]},
            { category: '肩頸與修腳', items: [
                { id: 's_1', name: '足湯肩頸按摩 20分', price: 450, type: 'foot', active: true },
                { id: 's_2', name: '刮痧 (次)', price: 650, type: 'foot', active: true },
                { id: 'p_1', name: '修腳指甲+修腳皮', price: 1000, type: 'foot', active: true },
                { id: 'p_2', name: '腳底按摩+修腳皮', price: 1300, type: 'foot', active: true }
            ]}
        ];

        let state = {
            currentTab: '',
            isAdminAuth: false,
            isSidebarOpen: window.innerWidth > 768,
            stores: [
                { id: 'store_qc', name: '中清店 (臺中市北區中清路一段856號)', active: true, isDefault: true },
                { id: 'store_zg', name: '中港店 (臺中市西區臺灣大道二段157號)', active: false, isDefault: false },
                { id: 'store_zk', name: '中科店 (臺中市西屯區永福路170號)', active: false, isDefault: false }
            ],
            groups: [] // 將由 Firebase 接管
        };

        // 因為改為 module 寫法，HTML 上的 onclick 需要綁定到 window 才能觸發
        window.toggleSidebar = toggleSidebar;
        window.copyShareLink = copyShareLink;
        window.switchTab = switchTab;
        window.addGroup = addGroup;
        window.deleteGroup = deleteGroup;
        window.updateGroupName = updateGroupName;
        window.updateGroupStore = updateGroupStore;
        window.updateGroupDate = updateGroupDate;
        window.updateGroupTimeStart = updateGroupTimeStart;
        window.updateGroupTimeEnd = updateGroupTimeEnd;
        window.updateItemName = updateItemName;
        window.updateItemPrice = updateItemPrice;
        window.addGuest = addGuest;
        window.removeGuest = removeGuest;
        window.updateGuestName = updateGuestName;
        window.updateGuestService = updateGuestService;
        window.updateGuestFemaleReq = updateGuestFemaleReq;
        window.showPasswordModal = showPasswordModal;
        window.closePasswordModal = closePasswordModal;
        window.verifyPassword = verifyPassword;
        window.toggleMenuItem = toggleMenuItem;
        window.toggleStoreItem = toggleStoreItem;

        let isAppReady = false;
        let isAdminLoaded = false;
        let isGroupsLoaded = false;

        async function initApp() {
            try {
                // 必須使用 Firebase Auth 才能存取資料庫 (匿名登入)
                await signInAnonymously(auth);
                
                // 1. 監聽管理員設定 (菜單與分店開關)
                const settingsRef = doc(db, 'artifacts', sysAppId, 'public', 'data', 'settings', 'admin');
                onSnapshot(settingsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.menuData) menuData = data.menuData;
                        if (data.stores) state.stores = data.stores;
                    } else {
                        // 初次建立資料庫預設值
                        saveAdminSettings();
                    }
                    isAdminLoaded = true;
                    checkAppReady();
                    if(isAppReady) render();
                }, (error) => console.error("設定載入失敗", error));

                // 2. 監聽所有團客資料 (即時同步)
                const groupsRef = collection(db, 'artifacts', sysAppId, 'public', 'data', 'groups');
                onSnapshot(groupsRef, (snapshot) => {
                    state.groups = [];
                    snapshot.forEach(doc => {
                        state.groups.push(doc.data());
                    });
                    
                    // 根據日期或建立時間排序(可選)，這邊以預設為主
                    isGroupsLoaded = true;
                    checkAppReady();
                    if(isAppReady) render();
                }, (error) => console.error("團客資料載入失敗", error));

            } catch (error) {
                console.error("Firebase 連線或登入失敗:", error);
                document.getElementById('top-title').textContent = "連線失敗，請檢查網路或 Firebase Auth 設定";
            }
        }

        function checkAppReady() {
            if (isAdminLoaded && isGroupsLoaded && !isAppReady) {
                isAppReady = true;
                // 初始路由解析
                if (window.location.hash) {
                    handleHashChange();
                } else if (state.groups.length > 0) {
                    switchTab(state.groups[0].id);
                } else {
                    switchTab('admin');
                }
                
                // 初始套用側邊欄 CSS 狀態
                if (!state.isSidebarOpen) {
                    document.getElementById('sidebar').classList.add('sidebar-collapsed');
                }
            }
        }

        // Firebase 資料寫入輔助函式
        function saveAdminSettings() {
            if (!auth.currentUser) return;
            setDoc(doc(db, 'artifacts', sysAppId, 'public', 'data', 'settings', 'admin'), {
                menuData: menuData,
                stores: state.stores
            }).catch(e => console.error(e));
        }

        function saveGroup(group) {
            if (!auth.currentUser) return;
            setDoc(doc(db, 'artifacts', sysAppId, 'public', 'data', 'groups', group.id), group)
                .catch(e => console.error(e));
        }

        function deleteGroupFromDB(groupId) {
            if (!auth.currentUser) return;
            deleteDoc(doc(db, 'artifacts', sysAppId, 'public', 'data', 'groups', groupId))
                .catch(e => console.error(e));
        }

        function render() {
            renderSidebar();
            updateTopBar();
            renderMainContent();
            
            // 行動裝置優化：點擊並渲染後自動收起側邊欄
            if (window.innerWidth <= 768 && state.isSidebarOpen) {
                toggleSidebar(false);
            }
        }

        function updateTopBar() {
            const titleEl = document.getElementById('top-title');
            const shareBtn = document.getElementById('share-container');
            
            if (!isAppReady) {
                titleEl.textContent = '系統載入中...';
                shareBtn.classList.add('hidden');
                return;
            }

            if (state.currentTab === 'admin') {
                titleEl.textContent = '管理員控制台';
                shareBtn.classList.add('hidden');
            } else {
                const group = state.groups.find(g => g.id === state.currentTab);
                titleEl.textContent = group ? group.name : '團客需求管理';
                if (group) {
                    shareBtn.classList.remove('hidden');
                    shareBtn.classList.add('flex');
                } else {
                    shareBtn.classList.add('hidden');
                    shareBtn.classList.remove('flex');
                }
            }
        }

        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            if (typeof forceState === 'boolean') {
                state.isSidebarOpen = forceState;
            } else {
                state.isSidebarOpen = !state.isSidebarOpen;
            }
            if (state.isSidebarOpen) {
                sidebar.classList.remove('sidebar-collapsed');
            } else {
                sidebar.classList.add('sidebar-collapsed');
            }
        }

        function renderSidebar() {
            const tabList = document.getElementById('tab-list');
            let html = '';
            const adminActive = state.currentTab === 'admin' ? 'bg-pine-light border-gold border-l-4' : 'hover:bg-pine-green border-transparent border-l-4';
            html += `
                <button onclick="switchTab('admin')" class="w-full text-left px-4 py-3 rounded-r flex items-center gap-3 transition-colors ${adminActive}">
                    <i class="fas fa-cog text-gold"></i>
                    <span class="${state.currentTab === 'admin' ? 'text-white font-bold' : 'text-gray-400'}">菜單與分店管理</span>
                </button>
            `;

            state.groups.forEach(group => {
                const isActive = state.currentTab === group.id ? 'bg-pine-light border-gold border-l-4' : 'hover:bg-pine-green border-transparent border-l-4';
                html += `
                    <div class="group relative flex items-center ${isActive} rounded-r transition-colors">
                        <button onclick="switchTab('${group.id}')" class="flex-1 text-left px-4 py-3 flex flex-col overflow-hidden">
                            <span class="truncate ${state.currentTab === group.id ? 'text-white font-bold' : 'text-gray-400'}">${group.name}</span>
                            ${group.date ? `<span class="text-xs text-gold-light opacity-70">${group.date} ${group.timeStart || group.time || ''}${group.timeEnd ? ' ~ ' + group.timeEnd : ''}</span>` : '<span class="text-xs text-gray-500 opacity-70">尚未設定時間</span>'}
                        </button>
                        <button onclick="deleteGroup('${group.id}')" class="absolute right-2 text-red-400 hover:text-red-300 opacity-0 group-hover:opacity-100 p-2">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>
                `;
            });
            tabList.innerHTML = html;
        }

        function renderMainContent() {
            const content = document.getElementById('main-content');
            if (state.currentTab === 'admin') {
                content.innerHTML = getAdminHTML();
            } else {
                const group = state.groups.find(g => g.id === state.currentTab);
                if (group) {
                    content.innerHTML = getGroupHTML(group);
                } else {
                    content.innerHTML = `<div class="text-center text-gray-400 mt-20">資料同步中或找不到該團客資料...</div>`;
                }
            }
        }

        function getAdminHTML() {
            let html = `
                <div class="max-w-4xl mx-auto">
                    <!-- 分店開放設定 -->
                    <div class="mb-8 bg-[#0a150f] p-6 rounded-lg border border-pine-green shadow-lg">
                        <h2 class="text-2xl font-bold text-gold tracking-wider flex items-center gap-3 border-b border-pine-green pb-3 mb-4">
                            <i class="fas fa-store"></i> 分店開放設定
                        </h2>
                        <p class="text-gray-400 mb-4 text-sm">請勾選開放給團客選擇的分店。(中清店為預設，無法關閉)</p>
                        <div class="flex flex-col gap-3">
                            ${state.stores.map((store, index) => `
                                <label class="flex items-center gap-3 p-3 bg-pine-dark rounded border border-pine-green ${store.isDefault ? 'opacity-70 cursor-not-allowed' : 'cursor-pointer hover:border-gold'}">
                                    <input type="checkbox" class="w-5 h-5 rounded cursor-pointer" 
                                        ${store.active ? 'checked' : ''} 
                                        ${store.isDefault ? 'disabled' : ''}
                                        onchange="toggleStoreItem(${index}, this.checked)">
                                    <span class="text-gray-200 font-bold">${store.name}</span>
                                    ${store.isDefault ? '<span class="text-xs bg-pine-green text-gold-light px-2 py-1 rounded ml-2">預設分店</span>' : ''}
                                </label>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-8 border-b border-pine-green pb-4 mt-12">
                        <h2 class="text-3xl font-bold text-gold tracking-wider flex items-center gap-3">
                            <i class="fas fa-sliders-h"></i> 項目開放設定 (管理者)
                        </h2>
                        <p class="text-gray-400 mt-2">在此勾選欲開放給客人選擇的按摩服務。取消勾選的項目將不會出現在團客的下拉選單中。</p>
                    </div>
            `;

            menuData.forEach((category, catIndex) => {
                html += `
                    <div class="mb-8 bg-[#0a150f] p-6 rounded-lg border border-pine-green shadow-lg">
                        <h3 class="text-xl font-bold text-gold-light mb-4 border-l-4 border-gold pl-3">${category.category}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                category.items.forEach((item, itemIndex) => {
                    const badgeClass = item.type === 'body' ? 'bg-red-900/50 text-red-200' : 'bg-blue-900/50 text-blue-200';
                    const badgeText = item.type === 'body' ? '身體 (可選女師)' : '腳底/局部';
                    
                    html += `
                        <div class="service-item flex items-start gap-3 p-4 bg-pine-dark rounded border border-pine-green hover:border-gold transition-colors">
                            <div class="mt-2 flex items-center">
                                <input type="checkbox" class="w-5 h-5 cursor-pointer rounded" 
                                    ${item.active ? 'checked' : ''} 
                                    title="勾選以開放給客端選擇"
                                    onchange="toggleMenuItem(${catIndex}, ${itemIndex}, this.checked)">
                            </div>
                            <div class="flex-1">
                                <input type="text" value="${item.name}" 
                                    onchange="updateItemName(${catIndex}, ${itemIndex}, this.value)"
                                    class="w-full bg-black/40 border border-pine-green/50 rounded px-2 py-1 text-gray-200 focus:outline-none focus:border-gold font-bold text-sm mb-2" placeholder="項目名稱">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-1">
                                        <span class="text-gold text-sm">$</span>
                                        <input type="number" value="${item.price}" 
                                            onchange="updateItemPrice(${catIndex}, ${itemIndex}, this.value)"
                                            class="w-20 bg-black/40 border border-pine-green/50 rounded px-2 py-1 text-gold focus:outline-none focus:border-gold text-sm" placeholder="價格">
                                    </div>
                                    <span class="text-xs px-2 py-1 rounded ${badgeClass}">${badgeText}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            html += `</div>`;
            return html;
        }

        function getGroupHTML(group) {
            const activeItems = menuData.flatMap(cat => cat.items).filter(item => item.active);
            const activeStores = state.stores.filter(store => store.active);

            let totalGuests = group.guests.length;
            let femaleTherapistCount = 0;
            let bodyCount = 0;
            let footCount = 0;

            group.guests.forEach(guest => {
                if (guest.serviceId) {
                    const service = activeItems.find(i => i.id === guest.serviceId);
                    if (service) {
                        if (service.type === 'body') bodyCount++;
                        if (service.type === 'foot') footCount++;
                        if (guest.reqFemale && service.type === 'body') femaleTherapistCount++;
                    }
                }
            });

            let html = `
                <div class="max-w-5xl mx-auto flex flex-col h-full">
                    
                    <div class="bg-pine-dark p-6 rounded-t-lg border-b-2 border-gold flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 shrink-0">
                        <div class="flex-1 w-full xl:w-auto">
                            <input type="text" value="${group.name}" 
                                onchange="updateGroupName('${group.id}', this.value)"
                                class="bg-transparent text-2xl font-bold text-gold border-b border-transparent hover:border-pine-light focus:border-gold focus:outline-none w-full pb-1 transition-colors"
                                placeholder="輸入團名 (例: 雄獅旅遊-A團)">
                        </div>
                        <div class="flex flex-col md:flex-row items-center gap-4 bg-black/30 p-3 rounded-lg border border-pine-green w-full xl:w-auto">
                            <div class="flex flex-col w-full md:w-auto">
                                <label class="text-xs text-gray-400 mb-1">預約分店</label>
                                <select onchange="updateGroupStore('${group.id}', this.value)" class="bg-pine-dark text-white border border-pine-light rounded px-2 py-1 text-sm focus:outline-none focus:border-gold appearance-none pr-8 relative">
                                    ${activeStores.map(store => `
                                        <option value="${store.id}" ${group.storeId === store.id ? 'selected' : ''}>${store.name.split(' ')[0]}</option>
                                    `).join('')}
                                </select>
                            </div>
                            <div class="flex flex-col w-full md:w-auto">
                                <label class="text-xs text-gray-400 mb-1">預約日期</label>
                                <input type="date" value="${group.date}" onchange="updateGroupDate('${group.id}', this.value)" class="bg-pine-dark text-white border border-pine-light rounded px-2 py-1 text-sm focus:outline-none focus:border-gold">
                            </div>
                            <div class="flex flex-col w-full md:w-auto">
                                <label class="text-xs text-gray-400 mb-1">預約時間區段</label>
                                <div class="flex items-center gap-1">
                                    <input type="time" value="${group.timeStart || group.time || ''}" onchange="updateGroupTimeStart('${group.id}', this.value)" class="bg-pine-dark text-white border border-pine-light rounded px-2 py-1 text-sm focus:outline-none focus:border-gold w-full md:w-auto">
                                    <span class="text-gray-400">~</span>
                                    <input type="time" value="${group.timeEnd || ''}" onchange="updateGroupTimeEnd('${group.id}', this.value)" class="bg-pine-dark text-white border border-pine-light rounded px-2 py-1 text-sm focus:outline-none focus:border-gold w-full md:w-auto">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 服務流程與注意事項提示 -->
                    <div class="bg-[#112419] border-b border-pine-green p-4 shrink-0">
                        <div class="flex items-start gap-3">
                            <i class="fas fa-info-circle text-gold mt-1"></i>
                            <div class="text-sm text-gray-300 space-y-1">
                                <p><strong class="text-gold-light">建議流程：</strong>因泡腳池有限及時間壓力，建議團客選擇 <span class="text-white font-bold bg-pine-light px-1 rounded">"指壓1小時"</span> (不需泡腳，到店後可直接進包廂服務，結束贈足湯包)。</p>
                                <p><strong class="text-gold-light">其他說明：</strong>服務腳底需要泡腳10分鐘+肩頸；歸苓膏皆採<span class="text-white font-bold">外帶</span>方式；顧客休息室可容納約 <span class="text-white font-bold">40</span> 位。</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#0a150f] p-6 border-x border-pine-green flex-1 overflow-y-auto">
                        <div class="flex justify-between items-end mb-4">
                            <h3 class="text-lg text-gray-200 font-bold border-l-4 border-gold pl-2">需求明細</h3>
                            <button onclick="addGuest('${group.id}')" class="bg-gold text-pine-dark hover:bg-gold-light font-bold py-1.5 px-4 rounded shadow transition-colors text-sm">
                                <i class="fas fa-user-plus mr-1"></i> 新增客人
                            </button>
                        </div>

                        ${group.guests.length === 0 ? `
                            <div class="text-center py-10 border-2 border-dashed border-pine-green rounded-lg text-gray-500">
                                目前尚無客人資料，請點擊上方按鈕新增。
                            </div>
                        ` : `
                            <div class="space-y-3">
                                <div class="grid grid-cols-12 gap-2 text-sm text-gray-400 px-4 pb-2 border-b border-pine-green hidden md:grid">
                                    <div class="col-span-1">編號</div>
                                    <div class="col-span-3">客人稱呼</div>
                                    <div class="col-span-5">選擇項目</div>
                                    <div class="col-span-2 text-center">指定女師</div>
                                    <div class="col-span-1 text-right">操作</div>
                                </div>
                        `}

                        ${group.guests.map((guest, index) => {
                            let optionsHTML = `<option value="">-- 請選擇服務項目 --</option>`;
                            menuData.forEach(cat => {
                                const availableItems = cat.items.filter(item => item.active);
                                if(availableItems.length > 0) {
                                    optionsHTML += `<optgroup label="【${cat.category}】">`;
                                    availableItems.forEach(item => {
                                        const selected = guest.serviceId === item.id ? 'selected' : '';
                                        optionsHTML += `<option value="${item.id}" ${selected}>${item.name} ($${item.price})</option>`;
                                    });
                                    optionsHTML += `</optgroup>`;
                                }
                            });

                            let isBodyService = false;
                            if (guest.serviceId) {
                                const selectedService = activeItems.find(i => i.id === guest.serviceId);
                                if (selectedService && selectedService.type === 'body') isBodyService = true;
                            }

                            return `
                                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center bg-pine-dark p-3 rounded border border-pine-green/50 hover:border-pine-light transition-colors">
                                    <div class="md:col-span-1 text-gold-light font-bold text-center md:text-left">
                                        <span class="md:hidden text-gray-400 text-xs">編號 </span>#${index + 1}
                                    </div>
                                    
                                    <div class="md:col-span-3">
                                        <input type="text" value="${guest.name}" placeholder="輸入姓名 (選填)"
                                            onchange="updateGuestName('${group.id}', '${guest.id}', this.value)"
                                            class="w-full bg-black/40 border border-pine-green rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-gold text-sm">
                                    </div>
                                    
                                    <div class="md:col-span-5 relative">
                                        <select onchange="updateGuestService('${group.id}', '${guest.id}', this.value)"
                                            class="w-full bg-black/40 border border-pine-green rounded px-3 py-2 text-gray-200 appearance-none focus:outline-none focus:border-gold text-sm cursor-pointer">
                                            ${optionsHTML}
                                        </select>
                                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                            <i class="fas fa-chevron-down text-xs"></i>
                                        </div>
                                    </div>
                                    
                                    <div class="md:col-span-2 flex justify-center items-center py-2 md:py-0 border-t md:border-t-0 border-pine-green/30 mt-2 md:mt-0">
                                        <label class="flex items-center gap-2 cursor-pointer ${isBodyService ? 'text-gray-200' : 'text-gray-600 opacity-50 cursor-not-allowed'}">
                                            <input type="checkbox" class="w-4 h-4 rounded" 
                                                ${guest.reqFemale ? 'checked' : ''} 
                                                ${!isBodyService ? 'disabled' : ''}
                                                onchange="updateGuestFemaleReq('${group.id}', '${guest.id}', this.checked)">
                                            <span class="text-sm select-none">指定女師</span>
                                            ${!isBodyService ? '<i class="fas fa-ban text-xs text-red-900/50 ml-1" title="非身體項目無法指定"></i>' : ''}
                                        </label>
                                    </div>
                                    
                                    <div class="md:col-span-1 flex justify-end">
                                        <button onclick="removeGuest('${group.id}', '${guest.id}')" class="text-red-500 hover:text-red-400 p-2 rounded hover:bg-red-900/20 transition-colors" title="刪除此列">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        
                        ${group.guests.length > 0 ? '</div>' : ''}
                    </div>

                    <div class="bg-pine-dark p-4 rounded-b-lg border-t-2 border-gold shrink-0 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div class="bg-black/30 rounded p-2 border border-pine-green">
                            <div class="text-xs text-gray-400">總人數</div>
                            <div class="text-2xl font-bold text-white">${totalGuests} <span class="text-sm font-normal text-gray-400">人</span></div>
                        </div>
                        <div class="bg-black/30 rounded p-2 border border-pine-green">
                            <div class="text-xs text-gray-400">身體項目數量</div>
                            <div class="text-2xl font-bold text-blue-200">${bodyCount} <span class="text-sm font-normal text-gray-400">人</span></div>
                        </div>
                        <div class="bg-black/30 rounded p-2 border border-pine-green">
                            <div class="text-xs text-gray-400">腳底項目數量</div>
                            <div class="text-2xl font-bold text-green-200">${footCount} <span class="text-sm font-normal text-gray-400">人</span></div>
                        </div>
                        <div class="bg-red-900/20 rounded p-2 border border-red-900/50">
                            <div class="text-xs text-red-200/70">女師需求總數</div>
                            <div class="text-2xl font-bold text-red-400">${femaleTherapistCount} <span class="text-sm font-normal text-red-300/50">位</span></div>
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        function switchTab(tabId) {
            if (tabId === 'admin' && !state.isAdminAuth) {
                showPasswordModal();
                return;
            }
            state.currentTab = tabId;
            window.location.hash = tabId; 
            if(window.location.hash.replace('#', '') === tabId) {
                render();
            }
        }

        window.addEventListener('hashchange', () => {
            if(isAppReady) handleHashChange();
        });
        
        function handleHashChange() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                if (hash === 'admin') {
                    if (!state.isAdminAuth) {
                        showPasswordModal();
                    } else if (state.currentTab !== 'admin') {
                        state.currentTab = 'admin';
                        render();
                    }
                } else {
                    let group = state.groups.find(g => g.id === hash);
                    if (!group) {
                        // 新分享連結自動建立群組寫入 Firebase
                        group = {
                            id: hash,
                            name: '新旅行團 (' + hash.substring(0,6) + ')',
                            date: '',
                            timeStart: '',
                            timeEnd: '',
                            storeId: 'store_qc',
                            guests: []
                        };
                        state.groups.push(group);
                        saveGroup(group);
                    }
                    if (state.currentTab !== hash) {
                        state.currentTab = hash;
                        render();
                    }
                }
            } else {
                if (state.groups.length > 0) switchTab(state.groups[0].id);
                else switchTab('admin');
            }
        }

        function showPasswordModal() {
            if (document.getElementById('pwd-modal')) return;
            const modalHtml = `
                <div id="pwd-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center z-[100] backdrop-blur-sm">
                    <div class="bg-pine-dark border border-gold p-6 rounded-lg max-w-sm w-full shadow-2xl">
                        <h3 class="text-xl text-gold font-bold mb-4"><i class="fas fa-lock mr-2"></i>管理員驗證</h3>
                        <p class="text-sm text-gray-400 mb-4">請輸入密碼以進入後台 (預設: 8888)</p>
                        <input type="password" id="admin-pwd" class="w-full bg-black/40 border border-pine-green rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-gold mb-2" placeholder="請輸入密碼">
                        <p id="pwd-error" class="text-red-400 text-sm mb-4 hidden">密碼錯誤，請重試！</p>
                        <div class="flex justify-end gap-3 mt-4">
                            <button onclick="closePasswordModal()" class="px-4 py-2 bg-gray-700 text-white rounded hover:bg-gray-600 transition">取消</button>
                            <button onclick="verifyPassword()" class="px-4 py-2 bg-gold text-pine-dark font-bold rounded hover:bg-gold-light transition">確認</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('admin-pwd').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') verifyPassword();
            });
            document.getElementById('admin-pwd').focus();
        }

        function closePasswordModal() {
            document.getElementById('pwd-modal')?.remove();
            if (window.location.hash === '#admin') {
                window.location.hash = state.currentTab || (state.groups.length > 0 ? state.groups[0].id : '');
            }
        }

        function verifyPassword() {
            const pwd = document.getElementById('admin-pwd').value;
            if (pwd === '8888') {
                state.isAdminAuth = true;
                document.getElementById('pwd-modal')?.remove();
                switchTab('admin');
            } else {
                document.getElementById('pwd-error').classList.remove('hidden');
                document.getElementById('admin-pwd').value = '';
                document.getElementById('admin-pwd').focus();
            }
        }
        
        function copyShareLink() {
            const url = window.location.href;
            const textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-5 right-5 bg-pine-light border border-pine-green text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 z-50 flex items-center gap-2';
                toast.innerHTML = `<i class="fas fa-check-circle text-gold-light"></i> 已複製此團專屬連結！`;
                document.body.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function toggleMenuItem(catIndex, itemIndex, isChecked) {
            menuData[catIndex].items[itemIndex].active = isChecked;
            saveAdminSettings();
        }

        function toggleStoreItem(storeIndex, isChecked) {
            if (!state.stores[storeIndex].isDefault) {
                state.stores[storeIndex].active = isChecked;
                if (!isChecked) {
                    const closedStoreId = state.stores[storeIndex].id;
                    const defaultStoreId = state.stores.find(s => s.isDefault).id;
                    state.groups.forEach(group => {
                        if (group.storeId === closedStoreId) {
                            group.storeId = defaultStoreId;
                            saveGroup(group);
                        }
                    });
                }
                saveAdminSettings();
            }
        }

        function addGroup() {
            const newId = 'group_' + Date.now();
            const newGroup = {
                id: newId,
                name: '新旅行團 (' + newId.substring(newId.length-4) + ')',
                date: '',
                timeStart: '',
                timeEnd: '',
                storeId: 'store_qc',
                guests: []
            };
            saveGroup(newGroup); // 寫入 Firebase
            switchTab(newId);
        }

        function deleteGroup(groupId) {
            const group = state.groups.find(g => g.id === groupId);
            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center z-[200] backdrop-blur-sm">
                    <div class="bg-pine-dark border border-gold p-6 rounded-lg max-w-sm w-full shadow-2xl">
                        <h3 class="text-xl text-white font-bold mb-4">確認刪除</h3>
                        <p class="text-gray-300 mb-6">確定要刪除「${group.name}」嗎？此操作無法還原。</p>
                        <div class="flex justify-end gap-3">
                            <button id="modal-cancel" class="px-4 py-2 bg-gray-700 text-white rounded hover:bg-gray-600 transition">取消</button>
                            <button id="modal-confirm" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-500 transition">確認刪除</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('modal-cancel').onclick = () => document.getElementById('custom-modal').remove();
            document.getElementById('modal-confirm').onclick = () => {
                deleteGroupFromDB(groupId); // 從 Firebase 刪除
                document.getElementById('custom-modal').remove();
                if (state.currentTab === groupId) {
                    const remainingGroups = state.groups.filter(g => g.id !== groupId);
                    const nextTab = remainingGroups.length > 0 ? remainingGroups[0].id : 'admin';
                    switchTab(nextTab);
                }
            };
        }

        function updateGroupName(groupId, newName) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) { group.name = newName; saveGroup(group); }
        }

        function updateGroupDate(groupId, val) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) { group.date = val; saveGroup(group); }
        }

        function updateGroupTimeStart(groupId, val) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) { group.timeStart = val; saveGroup(group); }
        }

        function updateGroupTimeEnd(groupId, val) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) { group.timeEnd = val; saveGroup(group); }
        }

        function updateGroupStore(groupId, val) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) { group.storeId = val; saveGroup(group); }
        }

        function addGuest(groupId) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                group.guests.push({
                    id: 'guest_' + Date.now() + Math.floor(Math.random() * 1000),
                    name: '',
                    serviceId: '',
                    reqFemale: false
                });
                saveGroup(group);
            }
        }

        function removeGuest(groupId, guestId) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                group.guests = group.guests.filter(g => g.id !== guestId);
                saveGroup(group);
            }
        }

        function updateItemName(catIndex, itemIndex, val) {
            menuData[catIndex].items[itemIndex].name = val;
            saveAdminSettings();
        }

        function updateItemPrice(catIndex, itemIndex, val) {
            menuData[catIndex].items[itemIndex].price = Number(val);
            saveAdminSettings();
        }

        function updateGuestName(groupId, guestId, name) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                const guest = group.guests.find(g => g.id === guestId);
                if (guest) { guest.name = name; saveGroup(group); }
            }
        }

        function updateGuestService(groupId, guestId, serviceId) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                const guest = group.guests.find(g => g.id === guestId);
                if (guest) {
                    guest.serviceId = serviceId;
                    let isBody = false;
                    for (let cat of menuData) {
                        const item = cat.items.find(i => i.id === serviceId);
                        if (item) {
                            isBody = (item.type === 'body');
                            break;
                        }
                    }
                    if (!isBody) guest.reqFemale = false;
                    saveGroup(group);
                }
            }
        }

        function updateGuestFemaleReq(groupId, guestId, isChecked) {
            const group = state.groups.find(g => g.id === groupId);
            if (group) {
                const guest = group.guests.find(g => g.id === guestId);
                if (guest) { guest.reqFemale = isChecked; saveGroup(group); }
            }
        }

        // 啟動應用程式，連接資料庫
        initApp();

    </script>
</body>
</html>
